services:
  # Deploys our custom Astron instance. Astron handles the bulk of Client network interaction
  # and game state management.
  astron:
    image: thetestgame/programmers-quest-astron:develop
    command: ["/app/build/astrond", "/app/astrond.yml"]
    networks:
      - default
      - programmers-quest
    ports:
      - "6667:6667/tcp" 
    volumes:
      - ../../astron/astrond.yml:/app/astrond.yml:ro
      - ../../quest:/quest:ro
      - pq-astron-db:/app/databases
      - pq-astron-logs:/app/logs
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # Deploys our UberDOG instance which handles global services for the entire
  # Programmer's Quest deployment.
  uberdog:
    image: thetestgame/programmers-quest-uberdog:develop
    networks:
      - programmers-quest
    environment:
      - ASTRON_IP=astron:7199
    links:
      - "astron:astron"
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  ai-shard-hacker-valley:
    image: thetestgame/programmers-quest-ai:develop
    networks:
      - programmers-quest
    environment:
      - ASTRON_IP=astron:7199
      - SHARD_NAME=Hacker Valley
    links:
      - "astron:astron"
    restart: unless-stopped
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

# Internal VLAN
networks:
  default:
  programmers-quest:

# Storage Volumes
volumes:
  pq-astron-db:
    driver: local
  pq-astron-logs:
    driver: local
